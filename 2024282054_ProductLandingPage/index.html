<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Tech - Product Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header">
    <div class="logo">
      <!-- Sila gunakan URL imej logo anda sendiri atau placeholder ini -->
      <img 
        id="header-img" 
        src="https://cdn.freecodecamp.org/testable-projects-fcc/images/product-landing-page-logo.png" 
        alt="Tech Logo"
      />
    </div>

    <nav id="nav-bar">
      <ul>
        <li><a class="nav-link" href="#features">Features</a></li>
        <li><a class="nav-link" href="#video-section">How it Works</a></li>
        <li><a class="nav-link" href="#pricing">Pricing</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h2>Handcrafted, home-made masterpieces</h2>
      <form id="form" action="https://www.freecodecamp.org/email-submit">
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email address" 
          required 
        />
        <input type="submit" id="submit" value="Get Started" />
      </form>
    </section>

    <section id="features">
      <div class="feature-item">
        <h3>Premium Materials</h3>
        <p>Our products use the highest quality materials to ensure durability.</p>
      </div>
      <div class="feature-item">
        <h3>Fast Shipping</h3>
        <p>We make sure you receive your product as soon as possible.</p>
      </div>
    </section>

    <section id="video-section">
      <iframe 
        id="video" 
        src="https://www.youtube-nocookie.com/embed/y8Yv4pnO7qc" 
        frameborder="0" 
        allowfullscreen
      ></iframe>
    </section>

    <section id="pricing">
      <div class="product" id="tenor">
        <div class="level">Tenor Trombone</div>
        <h2>$600</h2>
        <button class="btn">Select</button>
      </div>
      <div class="product" id="bass">
        <div class="level">Bass Trombone</div>
        <h2>$900</h2>
        <button class="btn">Select</button>
      </div>
    </section>
  </main>
</body>
</html>
