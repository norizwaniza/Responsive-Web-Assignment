<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Portfolio</title>

  <style>
    /* RESET */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* NAVBAR */
    #navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #1f2937;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
      z-index: 1000;
    }

    #navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    #navbar a:hover {
      color: #60a5fa;
    }

    /* WELCOME SECTION */
    #welcome-section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    #welcome-section h1 {
      font-size: 2.5rem;
    }

    /* PROJECT SECTION */
    #project-section {
      padding: 80px 20px;
      background-color: #f3f4f6;
      text-align: center;
    }

    .project-tile {
      background-color: white;
      padding: 20px;
      margin: 10px auto;
      width: 250px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .project-tile a {
      text-decoration: none;
      color: #1f2937;
      font-weight: bold;
    }

    /* PROFILE LINK */
    #profile-link {
      display: inline-block;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    /* MEDIA QUERY */
    @media (max-width: 600px) {
      #navbar {
        flex-direction: column;
        align-items: center;
      }

      .project-tile {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav id="navbar">
    <a href="#welcome-section">Home</a>
    <a href="#project-section">Projects</a>
  </nav>

  <!-- WELCOME SECTION -->
  <section id="welcome-section">
    <h1>Hi, I'm a Web Developer</h1>
  </section>

  <!-- PROJECT SECTION -->
  <section id="project-section">

    <h2>My Projects</h2>

    <div class="project-tile">
      <a href="https://example.com" target="_blank">Project 1</a>
    </div>

    <a id="profile-link" href="https://github.com/" target="_blank">
      Visit My GitHub
    </a>

  </section>

</body>
</html>
