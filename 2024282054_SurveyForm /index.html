<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Satisfaction Survey</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">Customer Satisfaction Survey</h1>
      <p id="description">Thank you for taking the time to help us improve our service</p>
    </header>

    <form id="survey-form">
      <!-- Name Input -->
      <div class="form-group">
        <label id="name-label" for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="Enter your name" 
          required 
        />
      </div>

      <!-- Email Input -->
      <div class="form-group">
        <label id="email-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email" 
          required 
        />
      </div>

      <!-- Number Input -->
      <div class="form-group">
        <label id="number-label" for="number">Age (optional)</label>
        <input 
          type="number" 
          id="number" 
          name="age" 
          min="10" 
          max="99" 
          placeholder="Age" 
        />
      </div>

      <!-- Dropdown Select -->
      <div class="form-group">
        <label for="dropdown">Which option best describes your current role?</label>
        <select id="dropdown" name="role" required>
          <option disabled selected value="">Select current role</option>
          <option value="student">Student</option>
          <option value="job">Full Time Job</option>
          <option value="learner">Full Time Learner</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Radio Buttons -->
      <div class="form-group">
        <p>Would you recommend us to a friend?</p>
        <label>
          <input name="user-recommend" value="definitely" type="radio" class="input-radio" checked /> Definitely
        </label>
        <label>
          <input name="user-recommend" value="maybe" type="radio" class="input-radio" /> Maybe
        </label>
        <label>
          <input name="user-recommend" value="not-sure" type="radio" class="input-radio" /> Not sure
        </label>
      </div>

      <!-- Checkboxes -->
      <div class="form-group">
        <p>What would you like to see improved? (Check all that apply)</p>
        <label>
          <input name="prefer" value="front-end" type="checkbox" class="input-checkbox" /> Front-end Projects
        </label>
        <label>
          <input name="prefer" value="back-end" type="checkbox" class="input-checkbox" /> Back-end Projects
        </label>
        <label>
          <input name="prefer" value="data-visualization" type="checkbox" class="input-checkbox" /> Data Visualization
        </label>
      </div>

      <!-- Textarea -->
      <div class="form-group">
        <p>Any comments or suggestions?</p>
        <textarea id="comments" name="comment" placeholder="Enter your comment here..."></textarea>
      </div>

      <!-- Submit Button -->
      <div class="form-group">
        <button type="submit" id="submit">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
